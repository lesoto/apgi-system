services:
  # PostgreSQL Database (API)
  postgres:
    image: postgres:14-alpine
    container_name: apgi_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apgi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-apgi_api}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql  # Requires scripts/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apgi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apgi-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: apgi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - apgi-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # APGI Framework (GUI)
  apgi-framework:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apgi-framework
    ports:
      - "8001:8000"
    volumes:
      - ./apgi_framework:/app/apgi_framework:cached
      - ./utils:/app/utils:cached
      - ./examples:/app/examples:cached
      - ./research:/app/research:cached
      - ./config:/app/config:cached
      - ./core:/app/core:cached
      - ./docs:/app/docs:cached
      - ./tests:/app/tests:cached
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./figures:/app/figures
      - ./reports:/app/reports
      - ./apgi_outputs:/app/apgi_outputs
    environment:
      - PYTHONPATH=/app
      - APGI_ENV=development
      - APGI_LOG_LEVEL=DEBUG
    depends_on:
      - redis
      - postgres
    networks:
      - apgi-network
    restart: unless-stopped

  # APGI API
  api:
    build: .
    container_name: apgi_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apgi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apgi_api}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./api:/app/api
      - ./apgi_framework:/app/apgi_framework
      - ./config:/app/config
    networks:
      - apgi-network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build: .
    container_name: apgi_celery_worker
    command: celery -A api.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apgi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-apgi_api}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./api:/app/api
      - ./apgi_framework:/app/apgi_framework
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "celery -A api.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - apgi-network
    restart: unless-stopped

