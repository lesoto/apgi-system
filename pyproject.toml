[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apgi-system"
version = "0.1.0"
description = "Allostatic Precision-Gated Ignition Framework"
readme = "APGI-System-README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "APGI Team"}
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jax>=0.4.13",
    "jaxlib>=0.4.13",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "pytest>=7.4.0",
    "hypothesis>=6.82.0",
    "jupyter>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "pytest-cov>=4.1.0",
    "types-requests>=2.28.0",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = ["apgi_system"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=apgi_system",
    "--cov=api",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=85",
]
markers = [
    "unit: Unit tests for individual components",
    "property: Property-based tests using Hypothesis",
    "integration: Integration tests for subsystem interactions",
    "slow: Tests that take significant time to run",
    "edge_case: Tests for edge cases and boundary conditions",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["apgi_system", "api"]
omit = [
    "**/apgi_gui.py",
    "**/*_GUI.py",
    "**/tests/*",
    "**/conftest.py",
    "**/__pycache__/*",
    "**/.*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
ignore_missing_imports = false
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["scipy.*", "h5py.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["APGI-GUI", "APGI-System-GUI", "Assistant-GUI", "Psychological-States-GUI", "Tests-GUI", "Utils-GUI"]
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_unused_ignores = false
disable_error_code = ["misc", "func-returns-value", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["api.tasks.experimental_tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
warn_unused_ignores = false

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
per-file-ignores = [
    "__init__.py: F401"
]