# APGI API Default Configuration
api:
  name: "APGI Simulation API"
  version: "1.0.0"
  debug: false

# Server settings
server:
  host: "0.0.0.0"
  port: 8000
  workers: 4

# Database settings
database:
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  echo: false

# Simulation settings
simulation:
  default_steps: 1000
  max_steps: 10000
  time_step: 0.001

# Logging settings
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Security settings
security:
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 30
  refresh_token_expire_days: 7
