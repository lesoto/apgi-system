name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Run black formatter check
        run: |
          black --check --diff apgi_system tests

      - name: Run flake8 linter
        run: |
          flake8 apgi_system tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 apgi_system tests --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

      - name: Run mypy type checker
        run: |
          mypy apgi_system --ignore-missing-imports --no-strict-optional --allow-untyped-calls --allow-untyped-defs
        continue-on-error: true

      - name: Run pytest with coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          pytest tests/ -v --cov=apgi_system --cov=api --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=100

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
