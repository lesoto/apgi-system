name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  bandit-sast:
    name: Bandit Security Audit (SAST)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
      
      - name: Run Bandit SAST scan
        run: |
          bandit -r apgi_framework/ api/ -f json -o bandit-report.json || true
          bandit -r apgi_framework/ api/ -f txt -o bandit-report.txt || true
      
      - name: Check Bandit results
        run: |
          if grep -q '"issue_severity": "HIGH"' bandit-report.json || \
             grep -q '"issue_severity": "CRITICAL"' bandit-report.json; then
            echo "::error::Bandit found HIGH/CRITICAL security issues"
            cat bandit-report.txt
            exit 1
          fi
          echo "Bandit scan passed - no HIGH/CRITICAL issues found"
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  safety-deps:
    name: Safety Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Safety
        run: |
          python -m pip install --upgrade pip
          pip install safety
      
      - name: Run Safety check
        run: |
          safety check --json --output safety-report.json || true
          safety check --full-report --output safety-report.txt || true
      
      - name: Check Safety results
        run: |
          if [ -f safety-report.json ] && grep -q '"vulnerable": true' safety-report.json; then
            echo "::warning::Safety found vulnerable dependencies"
            cat safety-report.txt
            # Don't fail CI for vulnerabilities, just warn
          fi
          echo "Safety check completed"
      
      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: safety-report.json

  pip-audit:
    name: pip-audit Dependency Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      
      - name: Run pip-audit
        run: |
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit --format=summary --output=pip-audit-summary.txt || true
      
      - name: Check pip-audit results
        run: |
          if [ -f pip-audit-report.json ] && [ -s pip-audit-report.json ]; then
            vulnerabilities=$(cat pip-audit-report.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('vulnerabilities', [])))" 2>/dev/null || echo "0")
            if [ "$vulnerabilities" -gt 0 ]; then
              echo "::warning::pip-audit found $vulnerabilities vulnerabilities"
              cat pip-audit-summary.txt
            fi
          fi
      
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Secret Detection
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [bandit-sast, safety-deps, pip-audit, codeql-analysis, secrets-scan]
    if: always()
    
    steps:
      - name: Security Scan Results
        run: |
          echo "=== Security Scan Summary ==="
          echo "Bandit SAST: ${{ needs.bandit-sast.result }}"
          echo "Safety: ${{ needs.safety-deps.result }}"
          echo "pip-audit: ${{ needs.pip-audit.result }}"
          echo "CodeQL: ${{ needs.codeql-analysis.result }}"
          echo "Secrets: ${{ needs.secrets-scan.result }}"
          
          if [[ "${{ needs.bandit-sast.result }}" == "failure" ]] || \
             [[ "${{ needs.codeql-analysis.result }}" == "failure" ]]; then
            echo "::error::Critical security scans failed"
            exit 1
          fi
          
          echo "All critical security checks passed"
